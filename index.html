<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    #status { margin: 1rem 0; padding: .6rem .8rem; border-radius: .4rem; background: #f1f3f5; }
    /* Пустой статус не скрываем через display: none, иначе экранный диктор может не озвучить новый текст. */
    #status:empty { margin: 0; padding: 0; }
    #status[data-kind="warning"] { background: #fff4e5; border-left: 4px solid #e8590c; }
    #status[data-kind="error"] { background: #ffe3e3; border-left: 4px solid #c92a2a; }
    #draft { margin: 0; padding: .6rem .8rem; border: 1px solid #ced4da; border-radius: .4rem; font: inherit; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <h2>Результат разбора</h2>
    <p>Тема: <strong id="topic"></strong></p>
    <p>Черновик ответа. Проверьте его перед отправкой клиенту:</p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const TOPIC_LABELS = new Map([
      ["delivery", "Доставка"],
      ["pricing", "Цены и стоимость"],
      ["other", "Другое"],
    ]);
    const MESSAGES = {
      empty: "Введите текст заявки.",
      tooLarge: "Заявка слишком длинная для автоматического разбора. Сократите текст или подготовьте ответ вручную.",
      loading: "Разбираем заявку…",
      failed: "Автоматический разбор не получился",
      manual: "Черновика нет, прочитайте заявку и подготовьте ответ вручную.",
    };
    // Сбои по дороге до модели: страница определяет их сама, по ответу сервера или ошибке fetch.
    const CONNECTION_FAILURES = new Map([
      ["network", "нет связи с сервером"],
      ["request_timeout", "сервер не ответил вовремя"],
      ["server_error", "ошибка на сервере"],
      ["bad_response", "сервер вернул неожиданный ответ"],
    ]);
    const REQUEST_TIMEOUT_MS = 5000;

    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const statusBox = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    let currentRequest = 0;

    function showStatus(text, kind = "info") {
      statusBox.textContent = text;
      statusBox.dataset.kind = kind;
    }

    // Старый черновик не должен оставаться на экране рядом с новой заявкой.
    function clearResult() {
      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
    }

    function render(data) {
      const label = TOPIC_LABELS.get(data?.topic);
      if (data?.status === "ready" && label) {
        topic.textContent = label;
        draft.textContent = data.draft;
        result.hidden = false;
        showStatus("");
        return;
      }
      if (data?.status === "invalid_input") {
        showStatus(MESSAGES.empty, "error");
        return;
      }
      if (data?.status === "too_large") {
        showStatus(MESSAGES.tooLarge, "error");
        return;
      }
      // manual_review, ошибка сервера или сбой связи: черновика нет.
      showStatus(failureMessage(data), "warning");
    }

    function failureMessage(data) {
      if (data?.status === "manual_review") return `${MESSAGES.failed}. ${MESSAGES.manual}`;
      const failure = CONNECTION_FAILURES.get(data?.failure) ?? CONNECTION_FAILURES.get("bad_response");
      return `${MESSAGES.failed}: ${failure}. ${MESSAGES.manual}`;
    }

    // Возвращает JSON ответа сервера, а при сбое связи или ошибке сервера — { failure } с видом сбоя.
    async function requestTriage(text) {
      let reply;
      try {
        reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
          signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
        });
      } catch (error) {
        return { failure: error.name === "TimeoutError" ? "request_timeout" : "network" };
      }
      if (reply.status >= 500) return { failure: "server_error" };
      try {
        return await reply.json();
      } catch {
        return { failure: "bad_response" };
      }
    }

    // Черновик составлен по конкретному тексту. Текст изменился: убираем черновик
    // и отказываемся от ответа на ещё не завершённый запрос по старому тексту.
    message.addEventListener("input", () => {
      currentRequest += 1;
      button.disabled = false;
      clearResult();
      showStatus("");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult();
      const text = message.value;
      if (!text.trim()) {
        showStatus(MESSAGES.empty, "error");
        message.focus();
        return;
      }
      const requestId = ++currentRequest;
      button.disabled = true;
      showStatus(MESSAGES.loading);
      const data = await requestTriage(text);
      if (requestId !== currentRequest) return;
      button.disabled = false;
      render(data);
    });
  </script>
</body>
</html>
